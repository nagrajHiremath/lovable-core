name: Deploy Lovable UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lovable-ui/**'

env:
  SERVICE_NAME: lovable-ui
  IMAGE_NAME: nagrajh/lovable-ui
  NAMESPACE: lovable-core

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # PHASE 1: BUILD & PUSH
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: ./lovable-ui
        run: |
          docker build \
            -t docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t docker.io/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push docker.io/${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # PHASE 2: DEPLOY
  # ============================================================
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
            ${{ env.SERVICE_NAME }}=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s
