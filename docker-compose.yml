services:

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  # Mirrors k8s/stateful/pgvector.yaml exactly.
  # Three separate DBs (account_db, workspace_db, intelligence_db) with
  # dedicated users – same structure as production.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lovable-pgvector-local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      # Per-service DB passwords injected into init script (see docker/postgres/init/01-init.sh)
      ACCOUNT_DB_PASSWORD: account_password
      WORKSPACE_DB_PASSWORD: workspace_password
      INTELLIGENCE_DB_PASSWORD: intelligence_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Kafka (KRaft, no ZooKeeper) ────────────────────────────────────────────
  # Same image and env vars as k8s/stateful/kafka.yaml.
  # Java services running on localhost connect via PLAINTEXT_HOST → localhost:29092
  kafka:
    image: confluentinc/confluent-local:7.5.0
    container_name: lovable-kafka-local
    environment:
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "ERROR"
      KAFKA_LOG4J_LOGGERS: "kafka=ERROR,org.apache.kafka=ERROR,state.change.logger=ERROR,kafka.controller=ERROR,kafka.coordinator=ERROR,kafka.server=ERROR,kafka.cluster=ERROR,kafka.log=ERROR"
      KAFKAREST_LOG4J_ROOT_LOGLEVEL: "ERROR"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"       # same pattern as k8s (pod-local)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "6PMpHYL9QkeyXRj9Nrp4KA"   # same static ID as k8s
    ports:
      - "29092:29092"   # ← use this in Spring: spring.kafka.bootstrap-servers=localhost:29092
      - "9092:9092"
      - "29093:29093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  # Mirrors k8s/stateful/redis.yaml – no password, plain redis:7-alpine.
  redis:
    image: redis:7-alpine
    container_name: lovable-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO ──────────────────────────────────────────────────────────────────
  # Mirrors k8s/stateful/minio.yaml – same image and port layout.
  # Credentials: MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (set locally here).
  minio:
    image: minio/minio:latest
    container_name: lovable-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the project-files bucket on first startup (mirrors runner-pool mc init).
  minio-init:
    image: minio/mc:latest
    container_name: lovable-minio-init-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/project-files;
      mc anonymous set private local/project-files;
      exit 0;
      "
    restart: "no"

  # ── Reverse Proxy (preview wildcard router) ────────────────────────────────
  # Reuses k8s/reverse-proxy Dockerfile and points to local compose Redis.
  reverse-proxy:
    build:
      context: .
      dockerfile: docker/reverse-proxy/Dockerfile
    image: ${REVERSE_PROXY_IMAGE:-lovable/reverse-proxy:local}
    container_name: lovable-reverse-proxy-local
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "80"
    ports:
      - "8080:80"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  kafka_data:
  redis_data:
  minio_data:
