apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-pool
  namespace: lovable-preview
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runner
      status: idle
  template:
    metadata:
      labels:
        app: runner
        status: idle
    spec:
      volumes:
        - name: workspace
          emptyDir: {}
      containers:
        - name: runner
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /app
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

        - name: syncer
          image: minio/mc
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          env:
            # Local defaults for Docker MinIO from docker-compose.yml
            - name: MINIO_USER
              value: "minioadmin"
            - name: MINIO_PASS
              value: "minioadmin123"
            # Pods use host.docker.internal to reach host-published MinIO at :9000
            - name: MC_HOST_myminio
              value: "http://minioadmin:minioadmin123@host.docker.internal:9000"
          volumeMounts:
            - name: workspace
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

