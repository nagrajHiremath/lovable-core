apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lovable-main-ingress
  namespace: lovable-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
    # No host = matches any IP/host (access via public ingress IP directly)

    # 1. Main Website Route (The Frontend!)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lovable-ui
                port:
                  number: 80

    # 2. API Gateway Route
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80