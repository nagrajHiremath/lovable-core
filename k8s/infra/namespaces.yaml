# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: lovable-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: lovable-preview

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: lovable-shared-config
  namespace: lovable-core
data:
  # Leading dot keeps subdomain routing intact; nip.io resolves the host without a real domain.
  PREVIEW_DOMAIN: ".34.14.138.43.nip.io"
  PREVIEW_NAMESPACE: "lovable-preview"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "localhost"
